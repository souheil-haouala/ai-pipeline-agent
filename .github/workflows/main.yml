{
  "name": "Python CI/CD Pipeline",
  "on": {
    "push": {
      "branches": ["main", "develop"]
    },
    "pull_request": {
      "branches": ["main", "develop"]
    },
    "workflow_dispatch": {}
  },
  "jobs": {
    "build-and-test": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout code",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Python environment",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.9"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install --upgrade pip\npip install -r requirements.txt"
        },
        {
          "name": "Run tests with pytest",
          "run": "pytest"
        },
        {
          "name": "Lint code with Flake8",
          "run": "pip install flake8\nflake8 . --count --select=E9,F63,F7,F82 --show-source --statistics\nflake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics"
        }
      ]
    }
  }
}