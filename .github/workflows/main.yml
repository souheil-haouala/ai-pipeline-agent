name: Node.js CI/CD Workflow (npm)
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
  security-events: write
env:
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  build_and_test:
    name: Build and Test Node.js App
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
        - 18.x
        - 20.x
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run linting
      run: npm run lint
    - name: Run tests
      run: npm test
    - name: Build application
      id: build-step
      run: npm run build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: node-app-build-${{ matrix.node-version }}
        path: dist/
      if: success() && steps.build-step.outcome == 'success'
    - name: Perform npm audit for vulnerabilities
      run: npm audit --audit-level=moderate
