name: Python Enterprise Test Automation Suite

on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
  security-events: write

jobs:
  build_and_test:
    name: Build and Test Python Agent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    # --- PYTHON VALIDATION MODULE ---
    - name: Set up Python ${{ matrix.python-version }} Environment
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Test Suites with Pytest Validation
      env:
        GEMINI_API_KEY: "mock_ci_placeholder_key"
      run: |
        python -m pytest

    # --- NODE.JS ECOSYSTEM MODULE (FIXED) ---
    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        # FIXED: cache variable is completely removed here to avoid lockfile errors

    - name: Install Dependencies
      run: |
        if [ -f package.json ]; then
          npm install
        fi

    - name: Run Linter
      run: |
        if [ -f package.json ] && npm run | grep -q "lint"; then
          npm run lint
        else
          echo "No Node linter available. Skipping step."
        fi

    - name: Run Tests
      run: |
        if [ -f package.json ] && npm run | grep -q "test"; then
          npm run test
        else
          echo "No Node test framework configured. Skipping step."
        fi
