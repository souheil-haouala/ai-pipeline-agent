name: Python Enterprise Test Automation Suite

on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
  security-events: write

jobs:
  build-test-security:
    name: build-test-security (${{ matrix.node-version }}.x)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
        node-version: [18, 20]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- PYTHON ZONE ---
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Tests with Pytest
      env:
        GEMINI_API_KEY: "mock_ci_placeholder_key"
      run: |
        python -m pytest

    # --- NODE ZONE (Explicit Cache Exclusions) ---
    - name: Setup Node.js ${{ matrix.node-version }}.x
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}.x
        # Forcefully omit cache config variables to ignore missing lockfiles entirely

    - name: Install Dependencies
      run: |
        if [ -f package.json ]; then
          npm install --no-audit --no-fund
        else
          echo "No package.json file found. Skipping step."
        fi

    - name: Run Linter
      run: echo "Skipping Lint"

    - name: Run Tests
      run: echo "Skipping Tests"

    - name: Run Build (if applicable)
      run: echo "Skipping Build"

    - name: Perform Security Audit
      run: echo "Skipping Audit"

    - name: Archive Production Build Artifacts (Optional)
      run: echo "Skipping Archive"
