name: Python Enterprise Test Automation Suite

on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
  security-events: write

jobs:
  build_and_test:
    name: Build and Test Python Agent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }} Environment
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Test Suites with Pytest Validation
      env:
        # Prevents defensive token validation layers from aborting runtime environments
        GEMINI_API_KEY: "mock_ci_placeholder_key"
      run: |
        python -m pytest
